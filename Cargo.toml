[workspace]
resolver = "2"
members = [
    "prettyplease-any",
]

[workspace.package]
version = "0.1.0"
authors = ["Techcable <git@techcable.net>"]
edition = "2024"
# 1.56 - 2021 edition
# 1.64 - workspace.package
# 1.68 - sparse index
# 1.71 - syn@3, const ptr::read
# 1.85 - 2024 edition
#
# if changed, keep in sync with CI
rust-version = "1.85"
repository = "https://github.com/Techcable/prettyplease-any.rs"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
## groups ##

cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# restrictions

redundant_test_prefix = "warn" # name test_foo is redundant with #[test] attr

# safety

multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

## aggressively lint casts ##
# in an ideal world, overflowing casts would panic
# linting them (with deny) is the second best option

cast_lossless = "allow" # lossless casts are fine, lints will catch if types change
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_ptr_alignment = "deny"
cast_sign_loss = "deny"
char_lit_as_u8 = "deny"
fn_to_numeric_cast = "deny"
fn_to_numeric_cast_any = "deny"
fn_to_numeric_cast_with_truncation = "deny"
ptr_as_ptr = "allow" # pointer casts are fine as long as they don't violate another rule

# excessively pedantic (even for clippy::pedantic)

# helps with constructing tokens
default_trait_access = "allow"
if_not_else = "allow"
items_after_statements = "allow"
# too many false positives
missing_panics_doc = "allow"
needless_continue = "allow"
# these can actually make things clearer
redundant_else = "allow"
too_many_lines = "allow"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.metadata.cargo-reedme]
note = "Do not edit - automatically generated by cargo-reedme"
